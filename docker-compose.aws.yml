# Override for AWS deployments (EC2 dev + ECS prod).
# Uses pre-built images from ECR — no build on the server.
# Usage: docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d

services:
  db:
    profiles:
      - disabled

  backend:
    image: ${BACKEND_IMAGE}
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      - DB_URL=jdbc:postgresql://${RDS_ENDPOINT}:5432/${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

  frontend:
    image: ${FRONTEND_IMAGE}

  data-engineering:
    image: ${ETL_IMAGE}
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      - DB_HOST=${RDS_ENDPOINT}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
