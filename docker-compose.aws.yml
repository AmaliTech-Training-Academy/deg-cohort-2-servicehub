# Override for AWS deployments (EC2 dev + ECS prod).
# Removes the local postgres container and points backend at RDS.
# Usage: docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d

services:
  db:
    profiles:
      - disabled

  backend:
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      - DB_URL=jdbc:postgresql://${RDS_ENDPOINT}:5432/${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
