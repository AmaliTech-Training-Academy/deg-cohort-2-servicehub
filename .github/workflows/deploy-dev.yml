name: Deploy to DEV

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Deploy to DEV server
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      # ── Build and push to ECR (shared repos, dev tags) ───────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -t ${{ secrets.PROD_ECR_BACKEND_URL }}:${{ github.sha }} ./backend
          docker push ${{ secrets.PROD_ECR_BACKEND_URL }}:${{ github.sha }}
          docker tag ${{ secrets.PROD_ECR_BACKEND_URL }}:${{ github.sha }} ${{ secrets.PROD_ECR_BACKEND_URL }}:dev-latest
          docker push ${{ secrets.PROD_ECR_BACKEND_URL }}:dev-latest

      - name: Build and push frontend
        run: |
          docker build -t ${{ secrets.PROD_ECR_FRONTEND_URL }}:${{ github.sha }} ./frontend
          docker push ${{ secrets.PROD_ECR_FRONTEND_URL }}:${{ github.sha }}
          docker tag ${{ secrets.PROD_ECR_FRONTEND_URL }}:${{ github.sha }} ${{ secrets.PROD_ECR_FRONTEND_URL }}:dev-latest
          docker push ${{ secrets.PROD_ECR_FRONTEND_URL }}:dev-latest

      # ── Pull and run on EC2 ──────────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd /opt/app

            ROLLBACK_SHA=$(git rev-parse HEAD)

            git fetch origin
            git checkout dev
            git pull origin dev

            export RDS_ENDPOINT=${{ secrets.DEV_RDS_ENDPOINT }}
            export DB_NAME=${{ secrets.DEV_DB_NAME }}
            export DB_USERNAME=${{ secrets.DEV_DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            export JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
            export BACKEND_IMAGE=${{ secrets.PROD_ECR_BACKEND_URL }}:dev-latest
            export FRONTEND_IMAGE=${{ secrets.PROD_ECR_FRONTEND_URL }}:dev-latest

            printf "DB_URL=jdbc:postgresql://%s:5432/%s\nDB_NAME=%s\nDB_USERNAME=%s\nDB_PASSWORD=%s\nJWT_SECRET=%s\nJWT_EXPIRATION_MS=86400000\nSPRING_PROFILES_ACTIVE=prod\nBACKEND_PORT=8080\nFRONTEND_PORT=80\nBACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n" \
              "${RDS_ENDPOINT}" "${DB_NAME}" "${DB_NAME}" "${DB_USERNAME}" "${DB_PASSWORD}" "${JWT_SECRET}" \
              "${BACKEND_IMAGE}" "${FRONTEND_IMAGE}" > /opt/app/.env

            aws ecr get-login-password --region eu-west-1 | \
              docker login --username AWS --password-stdin ${{ secrets.PROD_ECR_BACKEND_URL }}

            docker compose -f docker-compose.yml -f docker-compose.aws.yml pull
            docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --no-build

            docker system prune -f
            sleep 45

            if ! curl -sf http://localhost:8080/actuator/health; then
              echo "Health check failed — rolling back to $ROLLBACK_SHA"
              export BACKEND_IMAGE=${{ secrets.PROD_ECR_BACKEND_URL }}:${ROLLBACK_SHA}
              export FRONTEND_IMAGE=${{ secrets.PROD_ECR_FRONTEND_URL }}:${ROLLBACK_SHA}
              docker compose -f docker-compose.yml -f docker-compose.aws.yml pull
              docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --no-build
              echo "Rollback complete"
              exit 1
            fi

            docker compose ps

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"CI Alerts <onboarding@resend.dev>\",
              \"to\": [\"$MAIL_TO\"],
              \"subject\": \"Deploy to DEV failed\",
              \"text\": \"Deployment to DEV server failed.\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\nView run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
