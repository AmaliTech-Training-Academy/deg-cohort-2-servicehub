name: CI Pipeline

on:
  push:
  pull_request:
    branches: [dev, main]

# Each event type gets its own concurrency slot so push and PR runs complete
# independently — developers see checks on every push AND on every PR update.
# Multiple pushes to the same branch still cancel each other, as do multiple
# PR syncs, avoiding wasted runs within each event type.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      data_engineering: ${{ steps.filter.outputs.data_engineering }}
      qa: ${{ steps.filter.outputs.qa }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            data_engineering:
              - 'data-engineering/**'
            qa:
              - 'qa/**'

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run tests
        working-directory: ./backend
        run: mvn clean test

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run lint
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --no-watch

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: Build
        working-directory: ./frontend
        run: npm run build

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 12
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.data_engineering == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Scan backend
        if: needs.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'          # advisory — set to '1' to block on findings
          format: table
          output: trivy-backend.txt

      - name: Scan frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'          # advisory — set to '1' to block on findings
          format: table
          output: trivy-frontend.txt

      - name: Scan data-engineering
        if: needs.changes.outputs.data_engineering == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: data-engineering
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'          # advisory — set to '1' to block on findings
          format: table
          output: trivy-data-engineering.txt

      - name: Report to summary
        if: always()
        run: |
          {
            echo "## Trivy Security Scan (CRITICAL/HIGH only)"
            echo ""
            found=false
            for area in backend frontend data-engineering; do
              f="trivy-${area}.txt"
              if [ -s "$f" ]; then
                found=true
                echo "### $area"
                echo '```'
                cat "$f"
                echo '```'
                echo ""
              fi
            done
            [ "$found" = false ] && echo "No CRITICAL/HIGH findings in the scanned area(s)." || true
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    if: |
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build

  selenium:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    timeout-minutes: 20
    # Run when unit tests passed (or were skipped) AND something in the
    # auth-flow stack changed — backend, frontend, or the qa/ test sources.
    if: |
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.qa == 'true'
      )

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: servicehub_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build backend JAR
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Start backend
        run: |
          java -jar backend/target/servicehub-*.jar &
          echo "Waiting for backend to accept connections..."
          timeout 90 bash -c 'until curl -s http://localhost:8080 > /dev/null 2>&1; do sleep 3; done'
          echo "Backend is up."
        env:
          DB_URL: jdbc:postgresql://localhost:5432/servicehub_ci
          DB_USERNAME: ci
          DB_PASSWORD: ci_pass
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-jwt-secret-key-for-e2e-testing-only-32ch' }}
          SHOW_SQL: false

      - name: Build frontend Docker image
        run: docker build -t servicehub-frontend ./frontend

      - name: Start frontend container
        run: |
          docker run -d -p 4200:80 \
            --add-host backend:host-gateway \
            servicehub-frontend
          echo "Waiting for frontend to serve..."
          timeout 30 bash -c 'until curl -sf http://localhost:4200 > /dev/null 2>&1; do sleep 2; done'
          echo "Frontend is up."

      - name: Run Selenium tests
        working-directory: ./qa/ui-tests
        run: mvn test -Dbase.url=http://localhost:4200

      - name: Save Selenium report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: qa/ui-tests/target/surefire-reports/

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backend, frontend, trivy, docker, selenium]
    timeout-minutes: 5
    if: failure()
    steps:
      - name: Post failure to summary
        run: |
          {
            echo "## Pipeline Failed"
            echo ""
            echo "One or more jobs failed on branch \`${{ github.ref_name }}\`."
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Triggered by:** ${{ github.actor }}"
            echo ""
            echo "[View failed run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sends failure alert to the DevOps inbox via Resend (resend.com).
      # Requires RESEND_API_KEY and MAIL_TO secrets in GitHub → Settings → Secrets → Actions.
      # Self-skips gracefully if secrets are not configured yet.
      - name: Email notification
        if: github.ref_name == 'dev' || github.ref_name == 'main'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"CI Alerts <onboarding@resend.dev>\",
              \"to\": [\"$MAIL_TO\"],
              \"subject\": \"CI Failed — ${{ github.ref_name }}\",
              \"text\": \"Pipeline failed on branch ${{ github.ref_name }}.\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\nView run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
