name: CI Pipeline

on:
  push:
    branches-ignore:
      - dev
      - main
  pull_request:
    branches: [dev, main]

# Cancels in-progress runs on the same branch when a new push comes in.
# Uses head_ref (branch name) for PRs and ref_name for direct pushes so
# both events on the same branch share one concurrency slot — preventing
# double runs when a push updates an open PR.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      data_engineering: ${{ steps.filter.outputs.data_engineering }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            data_engineering:
              - 'data-engineering/**'

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run tests
        working-directory: ./backend
        run: mvn clean test

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # Lint is commented out until ESLint is configured in the frontend.
      # To enable:
      #   1. Run: ng add @angular-eslint/schematics
      #   2. Add "lint": "ng lint" to frontend/package.json scripts
      #   3. Uncomment the step below
      #
      # - name: Run lint
      #   working-directory: ./frontend
      #   run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --watch=false --code-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: Build
        working-directory: ./frontend
        run: npm run build

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 12
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.data_engineering == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Scan backend
        if: needs.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-backend.txt

      - name: Scan frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-frontend.txt

      - name: Scan data-engineering
        if: needs.changes.outputs.data_engineering == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: data-engineering
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-data-engineering.txt

      - name: Report to summary
        if: always()
        run: |
          {
            echo "## Trivy Security Scan (CRITICAL/HIGH only)"
            echo ""
            found=false
            for area in backend frontend data-engineering; do
              f="trivy-${area}.txt"
              if [ -s "$f" ]; then
                found=true
                echo "### $area"
                echo '```'
                cat "$f"
                echo '```'
                echo ""
              fi
            done
            [ "$found" = false ] && echo "No CRITICAL/HIGH findings in the scanned area(s)."
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    if: |
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backend, frontend, trivy, docker]
    timeout-minutes: 5
    if: failure()
    steps:
      - name: Post failure to summary
        run: |
          {
            echo "## Pipeline Failed"
            echo ""
            echo "One or more jobs failed on branch \`${{ github.ref_name }}\`."
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Triggered by:** ${{ github.actor }}"
            echo ""
            echo "[View failed run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Email notification — self-skips if MAIL_PASSWORD secret is not set.
      # To enable: add MAIL_USERNAME, MAIL_PASSWORD and MAIL_TO as repository secrets.
      - name: Email notification
        if: ${{ secrets.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failed — ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions
          body: |
            Pipeline failed on branch ${{ github.ref_name }}.

            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
