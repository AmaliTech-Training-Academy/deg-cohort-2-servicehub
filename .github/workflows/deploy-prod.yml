name: Deploy to PRODUCTION

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to ECS (Fargate)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Build and push backend image
        id: backend_image
        run: |
          IMAGE=${{ secrets.PROD_ECR_BACKEND_URL }}:${{ github.sha }}
          docker build -t $IMAGE ./backend
          docker push $IMAGE
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update backend task definition
        id: backend_task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: servicehub-prod-backend
          container-name: backend
          image: ${{ steps.backend_image.outputs.image }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend_task.outputs.task-definition }}
          service: ${{ secrets.PROD_ECS_BACKEND_SERVICE }}
          cluster: ${{ secrets.PROD_ECS_CLUSTER }}
          wait-for-service-stability: true

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Build and push frontend image
        id: frontend_image
        run: |
          IMAGE=${{ secrets.PROD_ECR_FRONTEND_URL }}:${{ github.sha }}
          docker build -t $IMAGE ./frontend
          docker push $IMAGE
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update frontend task definition
        id: frontend_task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: servicehub-prod-frontend
          container-name: frontend
          image: ${{ steps.frontend_image.outputs.image }}

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend_task.outputs.task-definition }}
          service: ${{ secrets.PROD_ECS_FRONTEND_SERVICE }}
          cluster: ${{ secrets.PROD_ECS_CLUSTER }}
          wait-for-service-stability: true
