jwt:
  secret: test-secret-key-for-testing-purposes-only-minimum-32-chars
  expiration: 86400000

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.EmbeddedDatabaseAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/servicehub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  thymeleaf:
    cache: false
