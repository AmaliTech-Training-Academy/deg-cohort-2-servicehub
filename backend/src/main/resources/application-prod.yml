# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
# All secrets MUST be injected via environment variables; no fallback defaults.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.servicehub: INFO
