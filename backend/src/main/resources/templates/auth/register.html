<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ServiceHub - Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow" style="width: 440px;">
        <div class="card-body p-4">
            <h4 class="card-title mb-4 text-center">Create Account</h4>
            <div id="error-alert" class="alert alert-danger d-none"></div>
            <form id="register-form">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" minlength="6" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Department (optional)</label>
                    <input type="text" id="department" class="form-control" placeholder="e.g. Engineering">
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Already have an account? <a href="/login">Login</a>
            </p>
        </div>
    </div>
</div>
<script>
    if (localStorage.getItem('token')) window.location.href = '/requests';

    document.getElementById('register-form').addEventListener('submit', async e => {
        e.preventDefault();
        const alertEl = document.getElementById('error-alert');
        alertEl.classList.add('d-none');
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    department: document.getElementById('department').value
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Registration failed');
            localStorage.setItem('token', data.token);
            localStorage.setItem('role', data.role);
            localStorage.setItem('fullName', data.fullName);
            localStorage.setItem('email', data.email);
            window.location.href = '/requests';
        } catch (err) {
            alertEl.textContent = err.message;
            alertEl.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
