<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ServiceHub - Request Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .badge-OPEN { background-color: #0d6efd; }
        .badge-ASSIGNED { background-color: #6f42c1; }
        .badge-IN_PROGRESS { background-color: #fd7e14; }
        .badge-RESOLVED { background-color: #198754; }
        .badge-CLOSED { background-color: #6c757d; }
        .priority-CRITICAL { color: #dc3545; font-weight: bold; }
        .priority-HIGH { color: #fd7e14; font-weight: 600; }
        .priority-MEDIUM { color: #ffc107; }
        .priority-LOW { color: #198754; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/">ServiceHub</a>
    <div class="d-flex align-items-center gap-3">
        <span id="user-name" class="text-light small"></span>
        <a href="/requests" class="btn btn-outline-light btn-sm">Back to Requests</a>
        <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
    </div>
</nav>

<div class="container" style="max-width: 800px;">
    <div id="error-alert" class="alert alert-danger d-none"></div>
    <div id="success-alert" class="alert alert-success d-none"></div>

    <div id="request-card" class="card shadow-sm d-none">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0" id="req-title"></h5>
                <small class="text-muted">Request #<span id="req-id"></span> &bull; Submitted by <span id="req-requester"></span></small>
            </div>
            <div>
                <span id="req-status-badge" class="badge fs-6"></span>
                <span id="req-overdue-badge" class="badge bg-danger ms-1 d-none">OVERDUE</span>
            </div>
        </div>
        <div class="card-body">
            <div class="row g-3 mb-3">
                <div class="col-sm-4">
                    <div class="text-muted small">Category</div>
                    <div id="req-category" class="fw-semibold"></div>
                </div>
                <div class="col-sm-4">
                    <div class="text-muted small">Priority</div>
                    <div id="req-priority" class="fw-semibold"></div>
                </div>
                <div class="col-sm-4">
                    <div class="text-muted small">Department</div>
                    <div id="req-department"></div>
                </div>
                <div class="col-sm-4">
                    <div class="text-muted small">Assigned To</div>
                    <div id="req-assigned"></div>
                </div>
                <div class="col-sm-4">
                    <div class="text-muted small">SLA Deadline</div>
                    <div id="req-sla"></div>
                </div>
                <div class="col-sm-4">
                    <div class="text-muted small">Created</div>
                    <div id="req-created"></div>
                </div>
            </div>
            <div class="mb-3">
                <div class="text-muted small mb-1">Description</div>
                <div id="req-description" class="border rounded p-3 bg-light"></div>
            </div>

            <!-- Edit form (only for requester or manager, when OPEN) -->
            <div id="edit-section" class="d-none border-top pt-3 mt-3">
                <h6>Edit Request</h6>
                <div class="row g-2">
                    <div class="col-12">
                        <input type="text" id="edit-title" class="form-control form-control-sm" placeholder="Title">
                    </div>
                    <div class="col-sm-6">
                        <select id="edit-category" class="form-select form-select-sm">
                            <option value="">Keep category</option>
                            <option value="IT_SUPPORT">IT Support</option>
                            <option value="FACILITIES">Facilities</option>
                            <option value="HR_REQUEST">HR Request</option>
                        </select>
                    </div>
                    <div class="col-sm-6">
                        <select id="edit-priority" class="form-select form-select-sm">
                            <option value="">Keep priority</option>
                            <option value="LOW">LOW</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HIGH">HIGH</option>
                            <option value="CRITICAL">CRITICAL</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <textarea id="edit-description" class="form-control form-control-sm" rows="3" placeholder="Description"></textarea>
                    </div>
                    <div class="col-12">
                        <button onclick="saveEdit()" class="btn btn-primary btn-sm">Save Changes</button>
                    </div>
                </div>
            </div>

            <!-- Status update (only for agents and managers) -->
            <div id="status-section" class="d-none border-top pt-3 mt-3">
                <h6>Update Status</h6>
                <div class="d-flex gap-2 flex-wrap" id="status-buttons"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    const role = localStorage.getItem('role');
    const myEmail = localStorage.getItem('email');
    document.getElementById('user-name').textContent = localStorage.getItem('fullName') + ' (' + role + ')';

    const requestId = window.location.pathname.split('/').pop();
    let currentRequest = null;

    const transitions = { OPEN: 'ASSIGNED', ASSIGNED: 'IN_PROGRESS', IN_PROGRESS: 'RESOLVED', RESOLVED: 'CLOSED' };

    async function loadRequest() {
        const res = await fetch('/api/requests/' + requestId, {
            headers: {'Authorization': 'Bearer ' + token}
        });
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (!res.ok) {
            document.getElementById('error-alert').textContent = 'Request not found.';
            document.getElementById('error-alert').classList.remove('d-none');
            return;
        }
        currentRequest = await res.json();
        renderRequest(currentRequest);
    }

    function renderRequest(r) {
        document.getElementById('request-card').classList.remove('d-none');
        document.getElementById('req-id').textContent = r.id;
        document.getElementById('req-title').textContent = r.title;
        document.getElementById('req-requester').textContent = r.requesterName;
        document.getElementById('req-category').textContent = r.category.replace('_', ' ');
        document.getElementById('req-priority').innerHTML = `<span class="priority-${r.priority}">${r.priority}</span>`;
        document.getElementById('req-department').textContent = r.departmentName || '-';
        document.getElementById('req-assigned').textContent = r.assignedToName || 'Unassigned';
        document.getElementById('req-sla').textContent = r.slaDeadline ? new Date(r.slaDeadline).toLocaleString() : '-';
        document.getElementById('req-created').textContent = new Date(r.createdAt).toLocaleString();
        document.getElementById('req-description').textContent = r.description || '(No description)';

        const badge = document.getElementById('req-status-badge');
        badge.textContent = r.status;
        badge.className = 'badge fs-6 badge-' + r.status;
        if (r.isOverdue) document.getElementById('req-overdue-badge').classList.remove('d-none');

        // Show edit section for requester (OPEN requests) or managers
        if (r.status === 'OPEN' && (role === 'MANAGER' || myEmail === r.requesterEmail)) {
            document.getElementById('edit-section').classList.remove('d-none');
            document.getElementById('edit-title').value = r.title;
            document.getElementById('edit-description').value = r.description || '';
        }

        // Show status buttons for agents and managers
        if (role === 'AGENT' || role === 'MANAGER') {
            const nextStatus = transitions[r.status];
            if (nextStatus) {
                document.getElementById('status-section').classList.remove('d-none');
                document.getElementById('status-buttons').innerHTML = `
                    <button onclick="updateStatus('${nextStatus}')" class="btn btn-sm btn-warning">
                        Move to ${nextStatus.replace('_', ' ')}
                    </button>`;
            }
        }
    }

    async function saveEdit() {
        const successEl = document.getElementById('success-alert');
        const errorEl = document.getElementById('error-alert');
        successEl.classList.add('d-none');
        errorEl.classList.add('d-none');
        const body = {};
        const title = document.getElementById('edit-title').value;
        const category = document.getElementById('edit-category').value;
        const priority = document.getElementById('edit-priority').value;
        const desc = document.getElementById('edit-description').value;
        if (title) body.title = title;
        if (category) body.category = category;
        if (priority) body.priority = priority;
        if (desc !== currentRequest.description) body.description = desc;

        const res = await fetch('/api/requests/' + requestId, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.error; errorEl.classList.remove('d-none'); return; }
        successEl.textContent = 'Request updated.';
        successEl.classList.remove('d-none');
        currentRequest = data;
        renderRequest(data);
    }

    async function updateStatus(newStatus) {
        const successEl = document.getElementById('success-alert');
        const errorEl = document.getElementById('error-alert');
        successEl.classList.add('d-none');
        errorEl.classList.add('d-none');
        const res = await fetch('/api/requests/' + requestId + '/status', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
            body: JSON.stringify({newStatus})
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.error; errorEl.classList.remove('d-none'); return; }
        successEl.textContent = 'Status updated to ' + newStatus;
        successEl.classList.remove('d-none');
        document.getElementById('status-section').innerHTML = '';
        renderRequest(data);
    }

    function logout() { localStorage.clear(); window.location.href = '/login'; }

    loadRequest();
</script>
</body>
</html>
