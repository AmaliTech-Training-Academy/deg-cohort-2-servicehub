<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ServiceHub - Submit Request</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/">ServiceHub</a>
    <div class="d-flex align-items-center gap-3">
        <span id="user-name" class="text-light small"></span>
        <a href="/requests" class="btn btn-outline-light btn-sm">Back to Requests</a>
        <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
    </div>
</nav>

<div class="container" style="max-width: 640px;">
    <h5 class="mb-4">Submit a New Service Request</h5>
    <div id="error-alert" class="alert alert-danger d-none"></div>
    <div id="success-alert" class="alert alert-success d-none"></div>

    <form id="request-form" class="card shadow-sm p-4">
        <div class="mb-3">
            <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
            <input type="text" id="title" class="form-control" placeholder="Brief description of the issue" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
            <select id="category" class="form-select" required>
                <option value="">-- Select Category --</option>
                <option value="IT_SUPPORT">IT Support</option>
                <option value="FACILITIES">Facilities</option>
                <option value="HR_REQUEST">HR Request</option>
            </select>
            <div class="form-text" id="routing-info"></div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Priority <span class="text-danger">*</span></label>
            <div class="d-flex gap-2 flex-wrap">
                <label class="btn btn-outline-success"><input type="radio" name="priority" value="LOW" required> LOW</label>
                <label class="btn btn-outline-warning"><input type="radio" name="priority" value="MEDIUM"> MEDIUM</label>
                <label class="btn btn-outline-danger"><input type="radio" name="priority" value="HIGH"> HIGH</label>
                <label class="btn btn-outline-danger fw-bold"><input type="radio" name="priority" value="CRITICAL"> CRITICAL</label>
            </div>
            <div class="form-text" id="sla-info"></div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Description</label>
            <textarea id="description" class="form-control" rows="5"
                      placeholder="Provide more details about your request..."></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Submit Request</button>
            <a href="/requests" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    document.getElementById('user-name').textContent = localStorage.getItem('fullName');

    const slaMap = { LOW: '48h resolution', MEDIUM: '24h resolution', HIGH: '4h resolution', CRITICAL: '2h resolution' };
    const routingMap = { IT_SUPPORT: 'IT Support dept', FACILITIES: 'Facilities dept', HR_REQUEST: 'HR dept' };

    document.querySelectorAll('input[name="priority"]').forEach(radio => {
        radio.addEventListener('change', () => {
            document.getElementById('sla-info').textContent = 'SLA: ' + (slaMap[radio.value] || '');
        });
    });

    document.getElementById('category').addEventListener('change', function() {
        const info = routingMap[this.value] || '';
        document.getElementById('routing-info').textContent = info ? 'Auto-routed to: ' + info : '';
    });

    document.getElementById('request-form').addEventListener('submit', async e => {
        e.preventDefault();
        const errorEl = document.getElementById('error-alert');
        const successEl = document.getElementById('success-alert');
        errorEl.classList.add('d-none');
        successEl.classList.add('d-none');

        const priority = document.querySelector('input[name="priority"]:checked');
        if (!priority) { errorEl.textContent = 'Please select a priority.'; errorEl.classList.remove('d-none'); return; }

        try {
            const res = await fetch('/api/requests', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    description: document.getElementById('description').value,
                    category: document.getElementById('category').value,
                    priority: priority.value
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Submission failed');
            successEl.textContent = 'Request #' + data.id + ' submitted successfully! Routed to: ' + (data.departmentName || 'pending assignment');
            successEl.classList.remove('d-none');
            document.getElementById('request-form').reset();
            document.getElementById('routing-info').textContent = '';
            document.getElementById('sla-info').textContent = '';
            setTimeout(() => window.location.href = '/requests', 2000);
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.classList.remove('d-none');
        }
    });

    function logout() { localStorage.clear(); window.location.href = '/login'; }
</script>
</body>
</html>
