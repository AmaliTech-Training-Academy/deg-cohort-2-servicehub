<div class="shell">
  <!-- Sidebar -->
  <aside class="side" [class.open]="navOpen()">
    <div class="brand">
      <div class="logo" style="width:34px;height:34px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 13h2a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5ZM20 13h-2a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-5ZM18 19a3 3 0 0 1-3 3h-3"/></svg>
      </div>
      <div class="bt">
        <b>ServiceHub</b>
      </div>
    </div>

    <div class="nav-group">{{ navGroup }}</div>
    <nav class="nav">
      @for (item of navItems; track item.route) {
        <button [class.active]="isActive(item.route)" (click)="navigate(item.route)">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="iconPath(item.icon)" /></svg>
          {{ item.label }}
        </button>
      }
    </nav>

    <div class="side-foot">
      <nav class="nav">
        <button (click)="logout()">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="iconPath('logout')" /></svg>
          Log out
        </button>
      </nav>
    </div>
  </aside>

  <!-- Scrim -->
  <div class="scrim" [class.show]="navOpen()"
    role="button" tabindex="0" aria-label="Close navigation"
    (click)="navOpen.set(false)"
    (keydown.enter)="navOpen.set(false)"
    (keydown.space)="navOpen.set(false)">
  </div>

  <!-- Main area -->
  <div class="main">
    <!-- Topbar -->
    <div class="topbar">
      <button class="hamburger" aria-label="Open navigation" (click)="navOpen.set(true)">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="iconPath('menu')" /></svg>
      </button>

      <!-- Breadcrumb -->
      <div class="crumbs">
        <span>Home</span>
        <svg class="ic sep" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="iconPath('chevron')" /></svg>
        <span class="cur">{{ pageTitle() }}</span>
      </div>

      <div class="spacer"></div>

      <!-- User info -->
      <div class="topbar-right">
        <span class="topbar-name">{{ fullName }}</span>
        <span class="role-badge">{{ roleLabel }}</span>
        <div class="avatar" style="width:32px;height:32px;font-size:13px">{{ initials }}</div>
      </div>

      @if (showNewRequestCta) {
        <button class="btn btn-primary" style="height:36px;font-size:14px;padding:0 14px" (click)="navigate('/requests/submit')">
          <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New request
        </button>
      }
    </div>

    <!-- Content -->
    <div class="content">
      <div class="container">
        <div class="page-head">
          <div>
            <h1 class="page-title">{{ pageTitle() }}</h1>
            @if (pageSubtitle()) {
              <p class="page-sub">{{ pageSubtitle() }}</p>
            }
          </div>
        </div>
        <router-outlet />
      </div>
    </div>
  </div>
</div>
